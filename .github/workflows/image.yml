# Builds the worker image and publishes it to GitHub Container Registry.
# The image is only published after selftest.py passes inside it.
# Layers are cached between runs (GitHub Actions cache): a change to the
# Python files rebuilds in minutes instead of recompiling the CUDA extensions.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # the CUDA devel base image is ~15 GB — free up the runner disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/docpats-img3d" >> $GITHUB_ENV
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: GIT_SHA=${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Self-test the image
        run: docker run --rm --entrypoint python $IMAGE:$TAG selftest.py
      - name: Push
        run: |
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
