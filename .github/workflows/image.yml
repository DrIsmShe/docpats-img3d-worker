# Builds the worker image and publishes it to GitHub Container Registry.
# The image is only published after selftest.py passes inside it.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # the CUDA devel base image is ~15 GB — free up the runner disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/docpats-img3d
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build --build-arg GIT_SHA=${GITHUB_SHA::7} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} .
      - name: Self-test the image
        run: docker run --rm --entrypoint python $IMAGE:${GITHUB_SHA::7} selftest.py
      - name: Push
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA::7}
